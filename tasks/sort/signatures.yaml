# sort 과제 시그니처 (기계 판독 부분은 harness/taskspec.py, param_docs 는 프롬프트에 그대로 들어간다).
# 정수 출력(int32): 하네스는 정확 일치로 판정한다(tolerance.yaml rtol = atol = 0). work 는 두지 않는다(gflops NA; docs/harness_design.md §17).
task: sort
function: sort
params: [x, out, n]
args:
  - {name: x,   kind: in,  dtype: int32, shape: [n]}
  - {name: out, kind: out, dtype: int32, shape: [n]}
  - {name: n, kind: dim}
baseline: {backend: python, file: baseline/baseline.py, openmp: false, gate_blas: false, gate_min_gflops: false}
languages:
  numpy:
    positional: "def sort(x, out, n):"
    keyword:    "def sort(*, x, out, n):"
    param_docs: |-
      - `x`: `numpy.ndarray`, dtype int32, shape (n,), C-contiguous, 64-byte aligned, read-only.
      - `out`: `numpy.ndarray`, dtype int32, shape (n,), C-contiguous, 64-byte aligned; the output buffer that must be filled with the sorted values.
      - `n`: Python `int`; the number of elements, always equal to the array shapes above.
      - Returns: `None` (the result is written into `out`).
  c_seq:
    positional: "void sort(const int* x, int* out, int n)"
    keyword: null        # M4: 매개변수 구조체
    param_docs: |-
      - `x`: n values of type `int` (32-bit), read-only. `out`: n values of type `int`, the output buffer that must be filled with the sorted values. Both start at 64-byte-aligned addresses.
      - `n`: the number of elements, always equal to the actual buffer sizes of `x` and `out`.
      - Return value: none (the result is written into `out`).
  c_openmp:
    positional: "void sort(const int* x, int* out, int n)"
    keyword: null        # M4: 매개변수 구조체
    param_docs: |-
      - `x`: n values of type `int` (32-bit), read-only. `out`: n values of type `int`, the output buffer that must be filled with the sorted values. Both start at 64-byte-aligned addresses.
      - `n`: the number of elements, always equal to the actual buffer sizes of `x` and `out`.
      - Return value: none (the result is written into `out`).
