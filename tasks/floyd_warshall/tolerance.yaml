# floyd_warshall 허용오차. 비교식: |out − ref| ≤ atol + rtol·|ref| (ref 는 float64 로 구한 모든 쌍 최단 거리).
# 실측(2026-11-21, 형태 5·97·256·1024): float32 구현(k 순서 정방향·역방향, min-plus 거듭제곱)의 최대 절대오차 2.1e-6,
# 이 허용오차에 대한 최대 비율 1.4e-3 → 여유 700배 이상. 재측정(2026-11-22, k 정방향·역방향·무작위 순서·min-plus 거듭제곱):
# 최대 절대오차 2.15e-6, 최대 비율 1.42e-3(rect, min-plus) 로 같다. 틀린 구현(중간 정점 루프가 가장 안쪽인 1회 완화 등)은 오차가 1 이상이다.
task: floyd_warshall
dtype: float32
rtol: 1.0e-4                   # 경로 길이는 float32 덧셈 몇 번이라 상대오차가 1e-6 수준
atol: 1.0e-4                   # 대각(참조 0)을 위한 절대 항
reference_dtype: float64
numeric_pattern_tol_ratio: 20
sentinel: -2048.0              # 출력 사전 채움값. 거리는 음이 아니므로 정당한 값이 될 수 없음
