# fft 과제 시그니처 (기계 판독 부분은 harness/taskspec.py). 언어별 시그니처·매개변수 설명은 harness/sigs.py 가 args 에서
# 만든다(languages 절 없음). doc 구절은 프롬프트의 매개변수 설명에 그대로 들어가므로 영어로, spec.md 와 같은 사실만 적는다.
task: fft
function: fft
params: [x, out, n]
args:
  - {name: x,   kind: in,  dtype: float32, shape: ["2*n"], doc: "n complex numbers stored interleaved: x[2*j] is the real part and x[2*j+1] the imaginary part of input element j"}
  - {name: out, kind: out, dtype: float32, shape: ["2*n"], doc: "n complex numbers stored interleaved: out[2*k] is the real part and out[2*k+1] the imaginary part of output element k"}
  - {name: n, kind: dim, doc: "the number of complex elements (a power of two, n >= 2); each array holds 2*n float32 values"}
# 복소 FFT 의 관례적 연산 수 5·n·log2(n): radix-2 버터플라이 (n/2)·log2(n) 개 × 실수 연산 10개(곱 4 + 덧셈 6; FFTW benchFFT 의
# mflops 정의와 같다). n 이 2의 거듭제곱이므로 log2(n) = (n − 1) 의 1 비트 수다(식은 내장 함수 없이 평가된다; taskspec.eval_expr).
work: "5*n*(n - 1).bit_count()"
baseline: {backend: python, file: baseline/baseline.py, openmp: false, gate_blas: false, gate_min_gflops: false}   # NumPy np.fft.fft (BLAS 무관)
