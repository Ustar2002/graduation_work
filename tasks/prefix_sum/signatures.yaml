# prefix_sum 과제 시그니처 (기계 판독 부분은 harness/taskspec.py). 언어별 시그니처·매개변수 설명은 harness/sigs.py 가
# args 에서 만든다(languages 절 없음). doc 는 프롬프트의 매개변수 설명에 그대로 붙는 영어 구절이다.
task: prefix_sum
function: prefix_sum
params: [x, out, n]
args:
  - {name: x,   kind: in,  dtype: int32, shape: [n], doc: "each value is in the range 0 <= x[i] < 16"}
  - {name: out, kind: out, dtype: int32, shape: [n]}
  - {name: n, kind: dim}
# work 는 두지 않는다: 부동소수 연산이 없는 정수 커널이라 gflops 는 NA 로 남긴다(정수 덧셈 횟수를 넣으면 gflops 열의 단위가 섞인다).
# 기준선은 NumPy 누적 합이다. BLAS 를 쓰지 않으므로 BLAS 정체 게이트(gate_blas)를 끈다.
baseline: {backend: python, file: baseline/baseline.py, openmp: false, gate_blas: false, gate_min_gflops: false}
