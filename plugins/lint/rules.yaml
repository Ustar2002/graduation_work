# 린트 베이스라인의 규칙 표 — plugins/lint/run_lint.py 가 읽는다 (CLAUDE.md §6, 설계 v3 §12.2).
#
# 도구마다: 그 도구에 넘기는 규칙 선택(도구 자신의 문법 그대로)과, 규칙 ID → 범주·심각도 대응(rules).
#
#   rules:
#     <규칙 ID>:  {category: …, severity: …, reason: "…"}    # 정확 일치
#     "<접두>*":  {category: …, severity: …, reason: "…"}    # 접두 일치
#
# - 정확 일치가 접두 일치보다, 긴 접두가 짧은 접두보다 우선한다.
# - category 는 CLAUDE.md §6 의 여섯 범주 중 하나: memory(경계·초기화·별칭), numeric(NaN/Inf·정수 오버플로·정밀도·
#   부동소수 비교), concurrency(공유 쓰기·리덕션 누락·비결정성), shape_dtype(차원·브로드캐스트·dtype 암묵 변환),
#   api_misuse(시그니처 위반·입력 변형·전역 상태), performance(성능 냄새).
# - severity: error = 그 줄이 실행되면 반드시 예외·미정의 동작·누수 / warning = 조건에 따라 결함 / info = 냄새·방어적 관례.
#   출력의 findings 는 이 순서(같으면 줄 번호 순)로 정렬된다 — 하네스가 수정 프롬프트에 앞에서부터 넣는다.
# - 표에 없는 규칙의 보고는 버리고 출력의 "unmapped" 에 수만 센다(어떤 규칙이었는지는 플러그인의 stderr 한 줄).
#   범주 정의에 분명히 들어맞는 규칙만 넣는다. 순수 스타일·위생 규칙과 범주가 애매한 일반 논리 오류는 넣지 않는다.
#   일부러 뺀 대표 규칙: F401(안 쓰는 임포트 — 위생), B007(안 쓰는 루프 변수 — 시간 스텝 루프 `for t in range(T)` 가 걸린다),
#   F811·B015·B018(범주가 없는 일반 논리 오류), clang-analyzer-security.FloatLoopCounter(cert-flp30-c 와 같은 줄을 두 번 센다).
# - rules 의 키는 도구의 규칙 선택에 자동으로 더해진다(ruff --select, clang-tidy -checks). 표에 줄을 더하면 그 규칙이 켜진다.

ruff:
  # 통째로 켜는 규칙 묶음. 묶음 안에서 표에 없는 규칙이 걸리면 unmapped 로 세어 표를 넓힐 근거로 남긴다.
  # NPY 묶음은 통째로 켜지 않고 아래 표의 세 규칙만 켠다: NPY003(폐기된 함수)이 잡는 이름은 전부 NPY201 도 잡아
  # 같은 줄을 두 번 세게 된다.
  select: [F, E9, B, PERF]
  rules:
    # ── memory
    F821: {category: memory, severity: error, reason: "정의되지 않은 이름 — 그 줄이 실행되면 NameError (초기화되지 않은 변수 사용의 Python 판)"}
    F823: {category: memory, severity: error, reason: "대입하기 전에 읽는 지역 변수 — UnboundLocalError"}
    PLE0643: {category: memory, severity: error, reason: "상수 인덱스가 리터럴 시퀀스의 범위를 벗어난다 — IndexError"}
    # ── numeric
    F632: {category: numeric, severity: warning, reason: "숫자 리터럴과의 is 비교는 값이 아니라 객체 동일성을 본다"}
    PLW0177: {category: numeric, severity: warning, reason: "NaN 과의 ==/!= 비교는 항상 거짓/참 — isnan 으로 검사해야 한다"}
    # ── concurrency
    PLW2101: {category: concurrency, severity: warning, reason: "with threading.Lock(): 은 매번 새 잠금을 만들어 공유 쓰기를 보호하지 못한다"}
    # ── shape_dtype
    NPY001: {category: shape_dtype, severity: error, reason: "np.float·np.int 같은 dtype 별칭은 NumPy 1.24 에서 제거됐다 — 설치된 NumPy 2.x 에서 AttributeError"}
    # ── api_misuse
    NPY002: {category: api_misuse, severity: warning, reason: "np.random.seed/rand 류는 프로세스 전역 난수 상태를 읽고 쓴다 (전역 상태)"}
    NPY201: {category: api_misuse, severity: warning, reason: "NumPy 2.0 에서 제거·대체된 이름 (np.round_, np.float_, np.product …) — 설치된 NumPy 2.x 에서 대부분 AttributeError, 일부(np.trapz 등)는 폐기 예정"}
    B006: {category: api_misuse, severity: warning, reason: "가변 기본 인자는 정의할 때 한 번 만들어져 호출 사이에 공유된다 (숨은 전역 상태)"}
    B008: {category: api_misuse, severity: warning, reason: "기본 인자의 함수 호출은 정의할 때 한 번만 평가된다 — 그 버퍼·객체를 모든 호출이 공유한다 (숨은 전역 상태)"}
    PLW0603: {category: api_misuse, severity: warning, reason: "global 문으로 모듈 전역을 고친다 (전역 상태)"}
    # ── performance
    "PERF*": {category: performance, severity: info, reason: "원소 단위 Python 루프로 리스트·딕셔너리를 만들거나 불필요하게 복사한다"}
    F841: {category: performance, severity: info, reason: "값을 계산·복사해 놓고 읽지 않는다 (불필요한 계산; 출력 버퍼에 쓰는 것을 잊은 경우도 여기에 걸린다)"}
    RUF015: {category: performance, severity: info, reason: "첫 원소 하나를 얻으려고 전체를 리스트로 만든다"}
    RUF017: {category: performance, severity: info, reason: "sum(리스트들, []) 은 매번 새 리스트를 만들어 이차 시간이 든다"}

pyflakes:
  # pyflakes 에는 규칙 ID 가 없다. 메시지(정규식, re.search)를 같은 뜻의 ruff F 코드로 바꿔 위 ruff 표에서 범주를 찾는다.
  # ruff 표에 있는 F 코드만 적으면 된다(나머지 메시지는 unmapped).
  messages:
    F632: "^use ==/!= to compare constant literals"
    F821: "^undefined name "
    F823: "^local variable .+ referenced before assignment$"
    F841: "^local variable .+ is assigned to but never used$"

cppcheck:
  # --enable 에 넘기는 심각도 묶음(error 는 항상 켜져 있다). style 은 순수 스타일 규칙이 대부분이라 켜지 않는다.
  enable: [warning, portability]
  rules:
    # ── memory: 경계
    arrayIndexOutOfBounds: {category: memory, severity: error, reason: "배열 인덱스가 범위를 벗어난다 (값 흐름 분석으로 확정)"}
    arrayIndexOutOfBoundsCond: {category: memory, severity: warning, reason: "조건에 따라 배열 인덱스가 범위를 벗어난다"}
    bufferAccessOutOfBounds: {category: memory, severity: error, reason: "memcpy·memset 등이 버퍼 크기 밖까지 접근한다"}
    "negative*": {category: memory, severity: error, reason: "음수 인덱스·음수 배열 크기·음수 할당 크기"}
    "pointerOutOfBounds*": {category: memory, severity: warning, reason: "포인터 연산 결과가 객체 범위 밖이다 (미정의 동작)"}
    objectIndex: {category: memory, severity: warning, reason: "단일 객체의 주소를 0 이 아닌 인덱스로 접근한다"}
    "ctu*": {category: memory, severity: error, reason: "다른 함수로 넘긴 포인터의 범위 밖 접근·초기화 안 된 값·널 역참조 (함수 간 분석)"}
    # ── memory: 초기화
    "uninit*": {category: memory, severity: error, reason: "초기화하지 않은 변수·malloc 한 메모리·구조체 멤버를 읽는다"}
    legacyUninitvar: {category: memory, severity: error, reason: "초기화하지 않은 변수를 읽는다"}
    # ── memory: 널·수명·해제
    nullPointer: {category: memory, severity: error, reason: "널 포인터 역참조"}
    "nullPointer*": {category: memory, severity: warning, reason: "조건에 따라 널 포인터 역참조 (널 검사와 모순되는 사용, malloc 실패를 검사하지 않음)"}
    "memleak*": {category: memory, severity: error, reason: "할당한 임시 메모리를 해제하지 않고 반환한다 (호출할 때마다 누수)"}
    "leak*": {category: memory, severity: error, reason: "할당 결과를 어디에도 저장하지 않는다 (누수)"}
    doubleFree: {category: memory, severity: error, reason: "같은 메모리를 두 번 해제한다"}
    deallocuse: {category: memory, severity: error, reason: "해제한 메모리를 사용한다"}
    deallocret: {category: memory, severity: error, reason: "해제한 포인터를 반환한다"}
    mismatchAllocDealloc: {category: memory, severity: error, reason: "할당 함수와 해제 함수의 짝이 맞지 않는다"}
    autovarInvalidDeallocation: {category: memory, severity: error, reason: "스택 변수를 free 한다"}
    autoVariables: {category: memory, severity: error, reason: "지역 변수의 주소가 함수 밖으로 나간다"}
    danglingLifetime: {category: memory, severity: error, reason: "수명이 끝난 지역 변수를 가리키는 포인터를 쓴다"}
    returnDanglingLifetime: {category: memory, severity: error, reason: "수명이 끝나는 지역 변수의 주소를 반환한다"}
    invalidLifetime: {category: memory, severity: error, reason: "범위를 벗어난 변수를 포인터로 쓴다"}
    # ── memory: 별칭·크기 계산
    invalidPointerCast: {category: memory, severity: warning, reason: "float*·double* 처럼 표현이 다른 타입 사이의 포인터 변환 (별칭 위반; 원소 크기가 달라 범위도 어긋난다)"}
    overlappingWriteFunction: {category: memory, severity: error, reason: "memcpy 등의 원본과 대상 영역이 겹친다 (별칭; 미정의 동작)"}
    "sizeof*": {category: memory, severity: warning, reason: "sizeof 오용 (배열 인자·포인터·숫자에 sizeof) — 버퍼 크기 계산이 틀린다"}
    pointerSize: {category: memory, severity: warning, reason: "데이터 크기 자리에 포인터 크기를 쓴다 (할당·memset 길이 오류)"}
    divideSizeof: {category: memory, severity: warning, reason: "포인터의 sizeof 로 원소 수를 계산한다"}
    incompleteArrayFill: {category: memory, severity: warning, reason: "배열을 원소 수 바이트만큼만 채운다 (sizeof 곱 누락)"}
    memsetZeroBytes: {category: memory, severity: warning, reason: "memset 의 길이가 0 이다 (값과 길이 인자가 뒤바뀜)"}
    # ── numeric
    integerOverflow: {category: numeric, severity: error, reason: "부호 있는 정수 오버플로 (미정의 동작)"}
    integerOverflowCond: {category: numeric, severity: warning, reason: "조건에 따라 부호 있는 정수 오버플로"}
    zerodiv: {category: numeric, severity: error, reason: "0 으로 나눈다"}
    zerodivcond: {category: numeric, severity: warning, reason: "조건에 따라 0 으로 나눈다"}
    floatConversionOverflow: {category: numeric, severity: error, reason: "부동소수 → 정수 변환이 표현 범위를 넘는다 (미정의 동작)"}
    "shiftTooManyBits*": {category: numeric, severity: error, reason: "비트 폭 이상의 시프트 (미정의 동작)"}
    "shiftNegative*": {category: numeric, severity: warning, reason: "음수만큼의 시프트·음수 값의 시프트"}
    invalidTestForOverflow: {category: numeric, severity: warning, reason: "오버플로가 난 뒤에 하는 오버플로 검사는 컴파일러가 지울 수 있다"}
    invalidFunctionArg: {category: numeric, severity: error, reason: "라이브러리 함수에 정의역 밖의 값을 넘긴다 (sqrt(-1), log(0) 등 → NaN/Inf)"}
    wrongmathcall: {category: numeric, severity: warning, reason: "수학 함수에 구현 정의 결과를 내는 값을 넘긴다"}
    # ── shape_dtype
    "signConversion*": {category: shape_dtype, severity: warning, reason: "음수가 될 수 있는 값이 부호 없는 타입으로 암묵 변환된다"}
    memsetFloat: {category: shape_dtype, severity: warning, reason: "memset 의 값 인자는 unsigned char 로 변환된다 — float 값으로는 채울 수 없다"}
    memsetValueOutOfRange: {category: shape_dtype, severity: warning, reason: "memset 의 값 인자가 unsigned char 범위를 넘어 잘린다"}

clang-tidy:
  # -checks 에 넘기는 목록. `-` 로 시작하는 항목은 끈다:
  #   bugprone-easily-swappable-parameters 는 하네스가 준 시그니처(같은 타입의 인자가 나란히 있다) 자체에 걸리고,
  #   clang-analyzer-security.insecureAPI.* 는 memcpy·memset 을 쓸 때마다 걸린다(_s 함수 권고).
  checks:
    - clang-analyzer-*
    - bugprone-*
    - openmp-*
    - performance-*
    - cert-flp30-c
    - -bugprone-easily-swappable-parameters
    - -clang-analyzer-security.insecureAPI.*
  # `--` 뒤에 넘기는 컴파일 인자. config/experiment.yaml 의 build.base_flags/cflags 를 바꾸면 여기도 맞춘다
  # (-march=native 가 없으면 AVX 인트린식을 쓴 커널이 컴파일 오류로 분석되지 않는다). c_openmp 에는 -fopenmp 가 더 붙는다.
  compile_args: ["-std=gnu11", "-march=native"]
  rules:
    # ── memory
    "clang-analyzer-core.*": {category: memory, severity: error, reason: "경로 민감 분석이 찾은 널 역참조·초기화 안 된 값 사용·스택 주소 유출"}
    "clang-analyzer-unix.Malloc*": {category: memory, severity: error, reason: "누수·이중 해제·해제 후 사용·malloc 크기와 타입 불일치"}
    clang-analyzer-unix.MismatchedDeallocator: {category: memory, severity: error, reason: "할당 함수와 해제 함수의 짝이 맞지 않는다"}
    "clang-analyzer-unix.cstring.*": {category: memory, severity: error, reason: "memcpy·strcpy 류의 길이 인자·널 인자 오류"}
    clang-analyzer-security.ArrayBound: {category: memory, severity: error, reason: "배열·버퍼의 범위 밖 접근"}
    clang-analyzer-security.PointerSub: {category: memory, severity: warning, reason: "서로 다른 객체를 가리키는 포인터의 뺄셈 (미정의 동작)"}
    clang-analyzer-optin.portability.UnixAPI: {category: memory, severity: warning, reason: "0 바이트 할당 — 반환값을 역참조할 수 없다"}
    "bugprone-sizeof-*": {category: memory, severity: warning, reason: "sizeof 오용 — 버퍼 크기 계산이 틀린다"}
    "bugprone-suspicious-mem*": {category: memory, severity: warning, reason: "memset·memcmp 의 인자가 의심스럽다 (값과 길이가 뒤바뀜, 패딩 비교)"}
    bugprone-misplaced-pointer-arithmetic-in-alloc: {category: memory, severity: error, reason: "할당 크기에 더할 값을 할당 결과 포인터에 더했다"}
    bugprone-suspicious-realloc-usage: {category: memory, severity: warning, reason: "p = realloc(p, …) 는 실패하면 원래 블록을 잃는다 (누수)"}
    bugprone-multi-level-implicit-pointer-conversion: {category: memory, severity: warning, reason: "다단계 포인터가 void* 로 암묵 변환된다 (간접 단계가 맞지 않는 접근)"}
    # ── numeric
    clang-analyzer-core.DivideZero: {category: numeric, severity: error, reason: "0 으로 나눈다"}
    clang-analyzer-core.BitwiseShift: {category: numeric, severity: error, reason: "비트 폭 이상·음수만큼의 시프트 (미정의 동작)"}
    cert-flp30-c: {category: numeric, severity: warning, reason: "부동소수 루프 카운터 — 반올림 오차가 쌓여 반복 횟수가 달라진다"}
    bugprone-float-loop-counter: {category: numeric, severity: warning, reason: "부동소수 루프 카운터 — 반올림 오차가 쌓여 반복 횟수가 달라진다"}
    bugprone-integer-division: {category: numeric, severity: warning, reason: "정수 나눗셈 결과를 부동소수 문맥에서 쓴다 (소수부 손실)"}
    bugprone-incorrect-roundings: {category: numeric, severity: warning, reason: "(int)(x + 0.5) 는 경계값에서 반올림이 틀린다"}
    bugprone-misplaced-widening-cast: {category: numeric, severity: warning, reason: "좁은 타입으로 계산한 뒤에 넓힌다 (오버플로가 이미 났다)"}
    bugprone-too-small-loop-variable: {category: numeric, severity: warning, reason: "루프 변수의 타입이 상한보다 좁다 (오버플로로 끝나지 않는 루프)"}
    bugprone-implicit-widening-of-multiplication-result: {category: numeric, severity: info, reason: "int 로 곱한 뒤 포인터 오프셋·넓은 타입으로 넓힌다 — 원소가 2^31 개를 넘는 버퍼에서 인덱스 오버플로"}
    # ── concurrency
    "openmp-*": {category: concurrency, severity: info, reason: "병렬 영역에 default(none) 이 없다 — 암묵 공유는 공유 쓰기·리덕션 누락의 전제 조건이다"}
    # ── shape_dtype
    bugprone-narrowing-conversions: {category: shape_dtype, severity: info, reason: "좁은 타입으로의 암묵 변환 (double → float, long → int, 정수 → float)"}
    performance-type-promotion-in-math-fn: {category: shape_dtype, severity: info, reason: "sqrt(x) 처럼 float 인자가 double 로 승격돼 계산된다 (sqrtf 를 쓰지 않음)"}
    # ── api_misuse
    bugprone-swapped-arguments: {category: api_misuse, severity: warning, reason: "암묵 변환으로 보아 호출 인자의 순서가 뒤바뀐 것으로 보인다"}
    # ── performance
